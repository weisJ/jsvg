<svg xmlns="http://www.w3.org/2000/svg" width="220" height="110" viewBox="0 0 220 110">
    <!-- transparentRgb -->
    <g transform="translate(0 0)">
        <defs>
            <filter id="f0" filterUnits="userSpaceOnUse" width="100" height="100" x="0" y="0" color-interpolation-filters="sRGB">
                <feColorMatrix values="0 0 0 0 0.2
                    0 0 0 0 0.4
                    0 0 0 0 0.6
                    0 0 0 0 0.0" />
                <feComponentTransfer>
                    <feFuncA type="linear" slope="0" intercept="1" />
                </feComponentTransfer>
            </filter>
        </defs>
        <rect width="100" height="100" fill="red" filter="url(#f0)" />
    </g>
    <!-- transparentRgbClip -->
    <g transform="translate(110 0)">
        <defs>
            <filter id="f1" filterUnits="userSpaceOnUse" width="100" height="100" x="0" y="0" color-interpolation-filters="sRGB">
                <feColorMatrix values="0 0 0 0 0.2
                    0 0 0 0 0.4
                    0 0 0 0 0.6
                    0 0 0 0 0.0" x="20" y="30" width="40" height="20" />
                <feComponentTransfer x="0" y="0" width="100" height="100">
                    <feFuncA type="linear" slope="0" intercept="1" />
                </feComponentTransfer>
            </filter>
        </defs>
        <g filter="url(#f1)">
            <rect height="25" x="10" y="10" fill="#ff0000" width="25" />
            <rect height="20" x="55" y="60" fill="#0000ff" width="30" />
        </g>
    </g>
</svg>
