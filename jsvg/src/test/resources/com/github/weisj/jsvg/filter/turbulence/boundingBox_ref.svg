<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100">
  <defs>
    <filter id="noStitch" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" seed="2" baseFrequency="2.3 1.7" numOctaves="3"
                    stitchTiles="noStitch" x="0" y="0" width="1" height="1"/>
    </filter>
    <filter id="stitch" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" seed="2" baseFrequency="2.3 1.7" numOctaves="3"
                    stitchTiles="stitch" x="0" y="0" width="1" height="1"/>
    </filter>
  </defs>
  <!-- noStitch; non-square bounds distinguish X/Y scaling. -->
  <g transform="translate(0 0)"><g transform="translate(15 20) scale(40 30)"><rect width="1" height="1" filter="url(#noStitch)"/></g></g>
  <!-- stitch; non-square bounds distinguish X/Y scaling. -->
  <g transform="translate(100 0)"><g transform="translate(15 20) scale(40 30)"><rect width="1" height="1" filter="url(#stitch)"/></g></g>
</svg>
