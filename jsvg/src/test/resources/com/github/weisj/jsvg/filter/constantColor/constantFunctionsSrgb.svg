<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220"
	viewBox="0 0 440 220">
	<!-- constantMatrixSrgb -->
	<g transform="translate(0 0)">
		<defs>
			<filter id="f0" filterUnits="userSpaceOnUse" width="100"
				height="100" x="0" y="0" color-interpolation-filters="sRGB">
				<feColorMatrix
					values="0 0 0 0 0.2
                    0 0 0 0 0.4
                    0 0 0 0 0.6
                    0 0 0 0 1.0" />
			</filter>
		</defs>
		<g filter="url(#f0)">
			<rect height="25" x="10" y="10" fill="#ff0000" width="25" />
			<rect height="20" x="55" y="60" fill="#0000ff" width="30" />
		</g>
	</g>
	<!-- constantTableSrgb -->
	<g transform="translate(110 0)">
		<defs>
			<filter id="f1" filterUnits="userSpaceOnUse" width="100"
				height="100" x="0" y="0" color-interpolation-filters="sRGB">
				<feComponentTransfer>
					<feFuncR type="table" tableValues=".2 .2" />
					<feFuncG type="table" tableValues=".4 .4" />
					<feFuncB type="table" tableValues=".6 .6" />
					<feFuncA type="table" tableValues="1 1" />
				</feComponentTransfer>
			</filter>
		</defs>
		<g filter="url(#f1)">
			<rect height="25" x="10" y="10" fill="#ff0000" width="25" />
			<rect height="20" x="55" y="60" fill="#0000ff" width="30" />
		</g>
	</g>
	<!-- constantDiscreteSrgb -->
	<g transform="translate(220 0)">
		<defs>
			<filter id="f2" filterUnits="userSpaceOnUse" width="100"
				height="100" x="0" y="0" color-interpolation-filters="sRGB">
				<feComponentTransfer>
					<feFuncR type="discrete" tableValues=".2 .2" />
					<feFuncG type="discrete" tableValues=".4 .4" />
					<feFuncB type="discrete" tableValues=".6 .6" />
					<feFuncA type="discrete" tableValues="1 1" />
				</feComponentTransfer>
			</filter>
		</defs>
		<g filter="url(#f2)">
			<rect height="25" x="10" y="10" fill="#ff0000" width="25" />
			<rect height="20" x="55" y="60" fill="#0000ff" width="30" />
		</g>
	</g>
	<!-- constantLinearSrgb -->
	<g transform="translate(330 0)">
		<defs>
			<filter id="f3" filterUnits="userSpaceOnUse" width="100"
				height="100" x="0" y="0" color-interpolation-filters="sRGB">
				<feComponentTransfer>
					<feFuncR type="linear" slope="0" intercept=".2" />
					<feFuncG type="linear" slope="0" intercept=".4" />
					<feFuncB type="linear" slope="0" intercept=".6" />
					<feFuncA type="linear" slope="0" intercept="1" />
				</feComponentTransfer>
			</filter>
		</defs>
		<g filter="url(#f3)">
			<rect height="25" x="10" y="10" fill="#ff0000" width="25" />
			<rect height="20" x="55" y="60" fill="#0000ff" width="30" />
		</g>
	</g>
	<!-- constantGammaSrgb -->
	<g transform="translate(0 110)">
		<defs>
			<filter id="f4" filterUnits="userSpaceOnUse" width="100"
				height="100" x="0" y="0" color-interpolation-filters="sRGB">
				<feComponentTransfer>
					<feFuncR type="gamma" amplitude="0" offset=".2" />
					<feFuncG type="gamma" amplitude="0" offset=".4" />
					<feFuncB type="gamma" amplitude="0" offset=".6" />
					<feFuncA type="gamma" amplitude="0" offset="1" />
				</feComponentTransfer>
			</filter>
		</defs>
		<g filter="url(#f4)">
			<rect height="25" x="10" y="10" fill="#ff0000" width="25" />
			<rect height="20" x="55" y="60" fill="#0000ff" width="30" />
		</g>
	</g>
</svg>
