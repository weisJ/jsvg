<svg viewBox="0 0 100 100" width="100" height="100"
	xmlns="http://www.w3.org/2000/svg"
	xmlns:xlink="http://www.w3.org/1999/xlink">
	<defs>
		<svg id="plain" width="20" height="20">
			<rect width="10" height="10" fill="blue" />
		</svg>
		<svg id="scaled" viewBox="0 0 20 20" width="20" height="20">
			<rect width="10" height="10" fill="red" />
		</svg>
	</defs>
	<!-- No viewBox on the target: sizing the viewport must not scale the content. -->
	<use xlink:href="#plain" x="10" y="10" width="40" height="40" />
	<!-- Declared viewBox on the target: content scales to the use-site size. -->
	<use xlink:href="#scaled" x="10" y="60" width="40" height="40" />
</svg>
