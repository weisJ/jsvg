<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <!-- Preserve the tile period when only a narrow slice of the input intersects the viewport. -->
  <defs>
    <filter id="tile" filterUnits="userSpaceOnUse" x="-1000" y="-1000" width="2000" height="2000"
            color-interpolation-filters="sRGB">
      <feFlood x="-1000000" y="10" width="2000000" height="0.25"/>
      <feTile x="0" y="0" width="100" height="100"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="10" height="10" fill="red" filter="url(#tile)"/>
</svg>
