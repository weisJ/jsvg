<svg xmlns="http://www.w3.org/2000/svg" width="60" height="20">
	<defs>
		<filter id="transparentBackdrop" x="0" y="0" width="1"
			height="1" color-interpolation-filters="linearRGB">
			<feFlood flood-opacity="0" result="clear" />
			<feComposite in="SourceGraphic" in2="clear"
				operator="over" />
		</filter>
		<filter id="opaqueSource" x="0" y="0" width="1" height="1"
			color-interpolation-filters="linearRGB">
			<feFlood flood-color="white" result="backdrop" />
			<feComposite in="SourceGraphic" in2="backdrop"
				operator="over" />
		</filter>
		<filter id="reuseSource" x="0" y="0" width="1" height="1"
			color-interpolation-filters="linearRGB">
			<feFlood flood-color="white" flood-opacity="0.5"
				result="white" />
			<feComposite in="SourceGraphic" in2="white"
				operator="atop" />
			<feOffset in="SourceGraphic" />
		</filter>
	</defs>
	<!-- Copy cases preserve dark colors; consuming a partial-alpha source must 
		not change it. -->
	<rect width="16" height="16" fill="#123456" fill-opacity="0.1"
		filter="url(#transparentBackdrop)" />
	<rect x="20" width="16" height="16" fill="#123456"
		filter="url(#opaqueSource)" />
	<rect x="40" width="16" height="16" fill="#123456"
		fill-opacity="0.1" filter="url(#reuseSource)" />
</svg>
