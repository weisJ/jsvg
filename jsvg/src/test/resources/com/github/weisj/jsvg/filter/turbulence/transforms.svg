<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <defs>
    <filter id="noise" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <feTurbulence type="fractalNoise" seed="2" baseFrequency="0.071 0.053" numOctaves="3"
                    stitchTiles="noStitch" x="12" y="20" width="40" height="40"/>
    </filter>
  </defs>
  <!-- Untransformed. -->
  <g transform="translate(0 0)">
    <g transform=""><rect x="5" y="5" width="75" height="75" filter="url(#noise)"/></g>
  </g>
  <!-- Translation and nonuniform scale. -->
  <g transform="translate(100 0)">
    <g transform="translate(7 9) scale(1.5 .75)"><rect x="5" y="5" width="75" height="75" filter="url(#noise)"/></g>
  </g>
  <!-- Reflection. -->
  <g transform="translate(0 100)">
    <g transform="matrix(-1 0 0 1 90 0)"><rect x="5" y="5" width="75" height="75" filter="url(#noise)"/></g>
  </g>
  <!-- Quarter turn. -->
  <g transform="translate(100 100)">
    <g transform="rotate(90 50 50)"><rect x="5" y="5" width="75" height="75" filter="url(#noise)"/></g>
  </g>
</svg>
