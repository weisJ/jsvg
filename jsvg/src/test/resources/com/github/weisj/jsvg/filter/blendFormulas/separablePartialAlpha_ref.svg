<svg xmlns="http://www.w3.org/2000/svg" width="40" height="100">
	<!-- W3C blend equation: co=(1-Ab)*As*Cs+(1-As)*Ab*Cb+As*Ab*B(Cb,Cs); Ao=As+Ab-As*Ab. 
		Round output to 8-bit premultiplied RGBA, then express as ordinary SVG artwork. -->
	<!-- overlay: B=0.68000000, 0.32000000, 0.48000000 -->
	<rect x="0" y="0" width="16" height="16" fill="#ae5174"
		fill-opacity="0.7764705882352941" />
	<!-- overlay: B=0.68000000, 0.32000000, 0.48000000 -->
	<rect x="20" y="0" width="16" height="16" fill="#ae5174"
		fill-opacity="0.7764705882352941" />
	<!-- hard-light: B=0.32000000, 0.68000000, 0.52000000 -->
	<rect x="0" y="20" width="16" height="16" fill="#936c76"
		fill-opacity="0.7764705882352941" />
	<!-- hard-light: B=0.32000000, 0.68000000, 0.52000000 -->
	<rect x="20" y="20" width="16" height="16" fill="#936c76"
		fill-opacity="0.7764705882352941" />
	<!-- color-dodge: B=1.00000000, 1.00000000, 1.00000000 -->
	<rect x="0" y="40" width="16" height="16" fill="#c58399"
		fill-opacity="0.7764705882352941" />
	<!-- color-dodge: B=1.00000000, 1.00000000, 1.00000000 -->
	<rect x="20" y="40" width="16" height="16" fill="#c58399"
		fill-opacity="0.7764705882352941" />
	<!-- color-burn: B=0.00000000, 0.00000000, 0.00000000 -->
	<rect x="0" y="60" width="16" height="16" fill="#7c3a50"
		fill-opacity="0.7764705882352941" />
	<!-- color-burn: B=0.00000000, 0.00000000, 0.00000000 -->
	<rect x="20" y="60" width="16" height="16" fill="#7c3a50"
		fill-opacity="0.7764705882352941" />
	<!-- exclusion: B=0.68000000, 0.68000000, 0.52000000 -->
	<rect x="0" y="80" width="16" height="16" fill="#ae6c76"
		fill-opacity="0.7764705882352941" />
	<!-- exclusion: B=0.68000000, 0.68000000, 0.52000000 -->
	<rect x="20" y="80" width="16" height="16" fill="#ae6c76"
		fill-opacity="0.7764705882352941" />
</svg>
