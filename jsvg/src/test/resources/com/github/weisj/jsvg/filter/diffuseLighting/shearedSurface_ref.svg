<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">
	<!-- A horizontal surface spanning the viewport has the same height profile 
		after an X shear. -->
	<defs>
		<filter id="lighting" filterUnits="userSpaceOnUse" x="-200"
			y="-200" width="600" height="600" color-interpolation-filters="sRGB">
			<feDiffuseLighting surfaceScale="8"
				kernelUnitLength="4">
				<feDistantLight azimuth="35" elevation="45" />
			</feDiffuseLighting>
		</filter>
	</defs>
	<g filter="url(#lighting)" transform="translate(0 0)">
		<rect x="-200" y="40" width="500" height="40" />
	</g>
</svg>
