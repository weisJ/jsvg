<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100">
	<defs>
		<filter id="noStitch" filterUnits="userSpaceOnUse"
			primitiveUnits="objectBoundingBox" x="15" y="20" width="40"
			height="30">
			<feTurbulence type="fractalNoise" seed="2"
				baseFrequency="2.3 1.7" numOctaves="3" stitchTiles="noStitch" x="0"
				y="0" width="1" height="1" />
		</filter>
		<filter id="stitch" filterUnits="userSpaceOnUse"
			primitiveUnits="objectBoundingBox" x="15" y="20" width="40"
			height="30">
			<feTurbulence type="fractalNoise" seed="2"
				baseFrequency="2.3 1.7" numOctaves="3" stitchTiles="stitch" x="0"
				y="0" width="1" height="1" />
		</filter>
	</defs>
	<!-- noStitch; non-square bounds distinguish X/Y scaling. -->
	<g transform="translate(0 0)">
		<rect x="15" y="20" width="40" height="30"
			filter="url(#noStitch)" />
	</g>
	<!-- stitch; non-square bounds distinguish X/Y scaling. -->
	<g transform="translate(100 0)">
		<rect x="15" y="20" width="40" height="30" filter="url(#stitch)" />
	</g>
</svg>
