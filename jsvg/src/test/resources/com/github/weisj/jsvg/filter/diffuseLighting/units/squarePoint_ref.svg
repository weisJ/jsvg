<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128">
	<!-- Flat surface and a light 64 user units above its center. -->
	<defs>
		<filter id="f" x="0" y="0" width="1" height="1"
			color-interpolation-filters="sRGB">
			<feDiffuseLighting surfaceScale="0">
				<fePointLight x="64" y="64" z="64" />
			</feDiffuseLighting>
		</filter>
	</defs>
	<rect x="32" y="32" width="64" height="64" filter="url(#f)" />
</svg>
