<svg xmlns="http://www.w3.org/2000/svg" width="96" height="32">
	<defs>
		<filter id="identity" filterUnits="userSpaceOnUse" x="0" y="0"
			width="96" height="32">
			<feOffset />
		</filter>
		<filter id="offset" filterUnits="userSpaceOnUse" x="0" y="0"
			width="96" height="32">
			<feOffset dx="24" />
		</filter>
	</defs>
	<!-- Ordinary SourceGraphic output can also move beyond the ancestor's shape 
		bounds. -->
	<g filter="url(#identity)">
		<rect x="4" y="4" width="12" height="20" fill="red" />
		<rect x="16" y="4" width="12" height="20" fill="blue"
			filter="url(#offset)" />
	</g>
</svg>
