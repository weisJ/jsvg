<svg xmlns="http://www.w3.org/2000/svg" width="120" height="20">
	<defs>
		<filter id="tile" filterUnits="userSpaceOnUse"
			primitiveUnits="objectBoundingBox" x="20" y="0" width="100"
			height="20">
			<feTile in="SourceGraphic" x="0" y="0" width="1" height="100%" />
			<feTile />
		</filter>
	</defs>
	<g filter="url(#tile)">
		<rect x="20" width="10" height="20" fill="red" />
		<rect x="30" width="10" height="20" fill="blue" />
	</g>
</svg>
