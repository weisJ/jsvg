<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
	<!-- Apply the root and nested translations directly to the artwork. -->
	<defs>
		<clipPath id="rootViewport">
			<rect x="20" y="20" width="400" height="400" />
		</clipPath>
		<clipPath id="greenViewport">
			<rect x="80" y="80" width="200" height="200" />
		</clipPath>
		<clipPath id="blueViewport">
			<rect x="80" y="80" width="100" height="100" />
		</clipPath>
	</defs>
	<!-- The transformed outer SVG viewport clips its artwork, including half 
		of its border stroke. -->
	<g clip-path="url(#rootViewport)">
		<rect x="20" y="20" width="400" height="400" stroke="red"
			fill="none" stroke-width="8" />
		<circle r="8" cx="60" cy="60" />
		<circle r="8" cx="80" cy="80" />
		<circle r="8" cx="100" cy="100" />
		<rect x="80" y="80" width="200" height="200" stroke="green"
			fill="none" stroke-width="4" clip-path="url(#greenViewport)" />
		<rect x="80" y="80" width="100" height="100" stroke="blue"
			fill="none" stroke-width="2" clip-path="url(#blueViewport)" />
	</g>
</svg>
