<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96">
	<defs>
		<linearGradient id="height"
			gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="255" y2="0">
			<stop offset="0" stop-opacity="0" />
			<stop offset="1" stop-opacity="1" />
		</linearGradient>
		<filter id="lighting" filterUnits="userSpaceOnUse" x="0" y="0"
			width="255" height="255" color-interpolation-filters="sRGB">
			<feDiffuseLighting surfaceScale="64">
				<feDistantLight azimuth="0" elevation="45" />
			</feDiffuseLighting>
		</filter>
	</defs>
	<!-- Reflection reverses the image gradient. The normal and light in primitive 
		coordinates are unchanged. -->
	<g transform="translate(48 48) scale(-1 1) translate(-128 -128)">
		<rect width="255" height="255" fill="url(#height)"
			filter="url(#lighting)" />
	</g>
</svg>
