<svg xmlns="http://www.w3.org/2000/svg"
	xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100">
	<!-- The tile also needs its source before the upstream offset, on the other 
		side of the clip. -->
	<defs>
		<filter id="tile" filterUnits="userSpaceOnUse" x="0" y="0"
			width="100" height="100">
			<feOffset dx="-80" x="10" y="10" width="10" height="10" />
			<feTile />
		</filter>
	</defs>
	<rect x="90" y="10" width="10" height="10" fill="red"
		filter="url(#tile)" />
</svg>
