<svg xmlns="http://www.w3.org/2000/svg" width="96" height="24">
	<!-- Matrix consumers quarter RGB and make alpha opaque. Transfer consumers 
		halve only alpha, leaving the selected-space RGB values unchanged. -->
	<defs>
		<filter id="matrixLinear" x="0" y="0" width="1" height="1">
			<feTurbulence type="fractalNoise" baseFrequency="0" />
			<feColorMatrix
				values=".25 0 0 0 0  0 .25 0 0 0  0 0 .25 0 0  0 0 0 0 1" />
		</filter>
		<filter id="matrixSrgb" x="0" y="0" width="1" height="1"
			color-interpolation-filters="sRGB">
			<feTurbulence type="fractalNoise" baseFrequency="0" />
			<feColorMatrix
				values=".25 0 0 0 0  0 .25 0 0 0  0 0 .25 0 0  0 0 0 0 1" />
		</filter>
		<filter id="alphaLinear" x="0" y="0" width="1" height="1">
			<feTurbulence type="fractalNoise" baseFrequency="0" />
			<feComponentTransfer>
				<feFuncA type="linear" slope=".5" />
			</feComponentTransfer>
		</filter>
		<filter id="alphaSrgb" x="0" y="0" width="1" height="1"
			color-interpolation-filters="sRGB">
			<feTurbulence type="fractalNoise" baseFrequency="0" />
			<feComponentTransfer>
				<feFuncA type="linear" slope=".5" />
			</feComponentTransfer>
		</filter>
	</defs>
	<rect width="24" height="24" filter="url(#matrixLinear)" />
	<rect x="24" width="24" height="24" filter="url(#matrixSrgb)" />
	<rect x="48" width="24" height="24" filter="url(#alphaLinear)" />
	<rect x="72" width="24" height="24" filter="url(#alphaSrgb)" />
</svg>
