<svg xmlns="http://www.w3.org/2000/svg" width="480" height="256">
	<!-- Translation. -->
	<g transform="translate(0 0)">
		<g transform="translate(7 11)">
			<g>
				<rect x="48" y="40" width="12" height="16" fill="#e08040" />
				<rect x="60" y="40" width="12" height="16" fill="#204060" />
			</g>
		</g>
	</g>
	<!-- Horizontal reflection. -->
	<g transform="translate(160 0)">
		<g transform="matrix(-1 0 0 1 128 0)">
			<g>
				<rect x="48" y="40" width="12" height="16" fill="#e08040" />
				<rect x="60" y="40" width="12" height="16" fill="#204060" />
			</g>
		</g>
	</g>
	<!-- Vertical reflection. -->
	<g transform="translate(320 0)">
		<g transform="matrix(1 0 0 -1 0 112)">
			<g>
				<rect x="24" y="24" width="12" height="16" fill="#e08040" />
				<rect x="36" y="24" width="12" height="16" fill="#204060" />
			</g>
		</g>
	</g>
	<!-- Quarter turn. -->
	<g transform="translate(0 128)">
		<g transform="rotate(90 64 64)">
			<g>
				<rect x="24" y="24" width="12" height="16" fill="#e08040" />
				<rect x="36" y="24" width="12" height="16" fill="#204060" />
			</g>
		</g>
	</g>
	<!-- Shear with bounding-box units. -->
	<g transform="translate(160 128)">
		<g transform="matrix(1 .25 .5 1 0 0)">
			<g>
				<rect x="48" y="40" width="12" height="16" fill="#e08040" />
				<rect x="60" y="40" width="12" height="16" fill="#204060" />
			</g>
		</g>
	</g>
	<!-- Nonuniform scale with bounding-box units. -->
	<g transform="translate(320 128)">
		<g transform="matrix(1.5 0 0 .75 4 8)">
			<g>
				<rect x="24" y="24" width="12" height="16" fill="#e08040" />
				<rect x="36" y="24" width="12" height="16" fill="#204060" />
			</g>
		</g>
	</g>
</svg>
