<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500"
	viewBox="0 0 144 80">
	<defs>
		<filter id="f" filterUnits="userSpaceOnUse" x="-100" y="-100"
			width="344" height="280" color-interpolation-filters="sRGB">
			<feGaussianBlur stdDeviation="1.5 0" edgeMode="none" />
		</filter>
	</defs>
	<rect width="144" height="80" fill="#d8d8d8" />
	<!-- Supply the horizontal duplicate-edge samples explicitly. -->
	<g filter="url(#f)">
		<rect x="-100" y="24" width="144" height="8" fill="#e08040" />
		<rect x="44" y="24" width="200" height="8" fill="#40c080" />
		<rect x="-100" y="32" width="144" height="8" fill="#204060" />
		<rect x="44" y="32" width="200" height="8" fill="#8040c0" />
	</g>
</svg>
