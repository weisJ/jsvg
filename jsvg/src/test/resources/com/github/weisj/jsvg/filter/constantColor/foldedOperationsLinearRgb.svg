<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220">
    <!-- foldMatrixLinearRgb -->
    <g transform="translate(0 0)">
        <defs>
            <filter id="f0" filterUnits="userSpaceOnUse" width="100" height="100" x="0" y="0" color-interpolation-filters="linearRGB">
                <feColorMatrix values="0 0 0 0 0.2
                    0 0 0 0 0.4
                    0 0 0 0 0.6
                    0 0 0 0 1.0" color-interpolation-filters="sRGB" />
                <feColorMatrix values=".5 0 0 .1 0
                    0 .5 0 0 .2
                    0 0 .5 0 0
                    0 0 0 .5 0" />
            </filter>
        </defs>
        <g filter="url(#f0)">
            <rect height="25" x="10" y="10" fill="#ff0000" width="25" />
            <rect height="20" x="55" y="60" fill="#0000ff" width="30" />
        </g>
    </g>
    <!-- foldSaturateLinearRgb -->
    <g transform="translate(110 0)">
        <defs>
            <filter id="f1" filterUnits="userSpaceOnUse" width="100" height="100" x="0" y="0" color-interpolation-filters="linearRGB">
                <feColorMatrix values="0 0 0 0 0.2
                    0 0 0 0 0.4
                    0 0 0 0 0.6
                    0 0 0 0 1.0" color-interpolation-filters="sRGB" />
                <feColorMatrix type="saturate" values=".3" />
            </filter>
        </defs>
        <g filter="url(#f1)">
            <rect height="25" x="10" y="10" fill="#ff0000" width="25" />
            <rect height="20" x="55" y="60" fill="#0000ff" width="30" />
        </g>
    </g>
    <!-- foldHueRotateLinearRgb -->
    <g transform="translate(220 0)">
        <defs>
            <filter id="f2" filterUnits="userSpaceOnUse" width="100" height="100" x="0" y="0" color-interpolation-filters="linearRGB">
                <feColorMatrix values="0 0 0 0 0.2
                    0 0 0 0 0.4
                    0 0 0 0 0.6
                    0 0 0 0 1.0" color-interpolation-filters="sRGB" />
                <feColorMatrix type="hueRotate" values="45" />
            </filter>
        </defs>
        <g filter="url(#f2)">
            <rect height="25" x="10" y="10" fill="#ff0000" width="25" />
            <rect height="20" x="55" y="60" fill="#0000ff" width="30" />
        </g>
    </g>
    <!-- foldLuminanceToAlphaLinearRgb -->
    <g transform="translate(330 0)">
        <defs>
            <filter id="f3" filterUnits="userSpaceOnUse" width="100" height="100" x="0" y="0" color-interpolation-filters="linearRGB">
                <feColorMatrix values="0 0 0 0 0.2
                    0 0 0 0 0.4
                    0 0 0 0 0.6
                    0 0 0 0 1.0" color-interpolation-filters="sRGB" />
                <feColorMatrix type="luminanceToAlpha" />
            </filter>
        </defs>
        <g filter="url(#f3)">
            <rect height="25" x="10" y="10" fill="#ff0000" width="25" />
            <rect height="20" x="55" y="60" fill="#0000ff" width="30" />
        </g>
    </g>
    <!-- foldTransferLinearRgb -->
    <g transform="translate(0 110)">
        <defs>
            <filter id="f4" filterUnits="userSpaceOnUse" width="100" height="100" x="0" y="0" color-interpolation-filters="linearRGB">
                <feColorMatrix values="0 0 0 0 0.2
                    0 0 0 0 0.4
                    0 0 0 0 0.6
                    0 0 0 0 1.0" color-interpolation-filters="sRGB" />
                <feComponentTransfer>
                    <feFuncR type="table" tableValues="1 .5 0" />
                    <feFuncG type="gamma" amplitude=".7" exponent="2" offset=".1" />
                    <feFuncA type="linear" slope=".5" />
                </feComponentTransfer>
            </filter>
        </defs>
        <g filter="url(#f4)">
            <rect height="25" x="10" y="10" fill="#ff0000" width="25" />
            <rect height="20" x="55" y="60" fill="#0000ff" width="30" />
        </g>
    </g>
</svg>
