<svg xmlns="http://www.w3.org/2000/svg" width="40" height="80">
	<!-- Source #339966 at 1/3 opacity over backdrop #cc3366 at 2/3. Both colors 
		have exact byte premultiplication. -->
	<defs>
		<filter id="hueconstants" x="0" y="0" width="1" height="1"
			color-interpolation-filters="sRGB">
			<feFlood flood-color="#cc3366"
				flood-opacity="0.6666666666666666" result="backdrop" />
			<feFlood flood-color="#339966"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="backdrop" mode="hue" />
		</filter>
		<filter id="hueartwork" x="0" y="0" width="1" height="1"
			color-interpolation-filters="sRGB">

			<feFlood flood-color="#339966"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="SourceGraphic" mode="hue" />
		</filter>
		<filter id="saturationconstants" x="0" y="0" width="1"
			height="1" color-interpolation-filters="sRGB">
			<feFlood flood-color="#cc3366"
				flood-opacity="0.6666666666666666" result="backdrop" />
			<feFlood flood-color="#339966"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="backdrop" mode="saturation" />
		</filter>
		<filter id="saturationartwork" x="0" y="0" width="1" height="1"
			color-interpolation-filters="sRGB">

			<feFlood flood-color="#339966"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="SourceGraphic" mode="saturation" />
		</filter>
		<filter id="colorconstants" x="0" y="0" width="1" height="1"
			color-interpolation-filters="sRGB">
			<feFlood flood-color="#cc3366"
				flood-opacity="0.6666666666666666" result="backdrop" />
			<feFlood flood-color="#339966"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="backdrop" mode="color" />
		</filter>
		<filter id="colorartwork" x="0" y="0" width="1" height="1"
			color-interpolation-filters="sRGB">

			<feFlood flood-color="#339966"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="SourceGraphic" mode="color" />
		</filter>
		<filter id="luminosityconstants" x="0" y="0" width="1"
			height="1" color-interpolation-filters="sRGB">
			<feFlood flood-color="#cc3366"
				flood-opacity="0.6666666666666666" result="backdrop" />
			<feFlood flood-color="#339966"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="backdrop" mode="luminosity" />
		</filter>
		<filter id="luminosityartwork" x="0" y="0" width="1" height="1"
			color-interpolation-filters="sRGB">

			<feFlood flood-color="#339966"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="SourceGraphic" mode="luminosity" />
		</filter>
	</defs>
	<!-- hue, constants -->
	<rect x="0" y="0" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#hueconstants)" />
	<!-- hue, artwork -->
	<rect x="20" y="0" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#hueartwork)" />
	<!-- saturation, constants -->
	<rect x="0" y="20" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#saturationconstants)" />
	<!-- saturation, artwork -->
	<rect x="20" y="20" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#saturationartwork)" />
	<!-- color, constants -->
	<rect x="0" y="40" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#colorconstants)" />
	<!-- color, artwork -->
	<rect x="20" y="40" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#colorartwork)" />
	<!-- luminosity, constants -->
	<rect x="0" y="60" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#luminosityconstants)" />
	<!-- luminosity, artwork -->
	<rect x="20" y="60" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#luminosityartwork)" />
</svg>
