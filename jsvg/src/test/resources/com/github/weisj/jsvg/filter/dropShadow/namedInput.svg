<svg xmlns="http://www.w3.org/2000/svg" width="112" height="88">
  <!-- Keep source outside the final shadow region until it has been blurred and moved. -->
  <!-- Select the saved input despite LastResult changing; expanding the result must not reveal clipped pixels. -->
  <defs>
    <filter id="f" filterUnits="userSpaceOnUse" x="0" y="0" width="112" height="88"
            color-interpolation-filters="sRGB">
      <feOffset result="input"/>
      <feFlood flood-color="magenta"/>
      <feDropShadow dx="-16" dy="0" stdDeviation="1.5" flood-color="black"
                    x="40" y="32" width="32" height="24" in="input" result="input"/>
      <feOffset in="input" x="0" y="0" width="112" height="88"/>
    </filter>
  </defs>
  <g filter="url(#f)">
    <rect x="64" y="36" width="16" height="16" fill="#c04020"/>
  </g>
</svg>
