<svg xmlns="http://www.w3.org/2000/svg" width="112" height="88">
	<!-- Keep source outside the final shadow region until it has been blurred 
		and moved. -->
	<defs>
		<filter id="f" filterUnits="userSpaceOnUse" x="0" y="0"
			width="112" height="88" color-interpolation-filters="sRGB">
			<feDropShadow dx="0" dy="-16" stdDeviation="4"
				flood-color="black" x="40" y="32" width="32" height="24" />
		</filter>
	</defs>
	<g filter="url(#f)">
		<rect x="48" y="52" width="16" height="16" fill="#c04020" />
	</g>
</svg>
