<svg xmlns="http://www.w3.org/2000/svg"
	xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100"
	viewBox="0 0 100 100">
	<defs>
		<filter id="f" filterUnits="userSpaceOnUse" x="10" y="15"
			width="65" height="60" color-interpolation-filters="sRGB">
			<feMerge x="25" y="30" width="20" height="10" />
			<feComponentTransfer>
				<feFuncA type="linear" slope="0" intercept="1" />
			</feComponentTransfer>
		</filter>
	</defs>
	<g filter="url(#f)">
		<rect height="20" x="20" y="30" fill="#ff0000" width="15" />
		<rect height="20" x="45" y="30" fill="#0000ff" width="15" />
	</g>
</svg>
