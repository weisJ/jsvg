<svg xmlns="http://www.w3.org/2000/svg" width="80" height="60">
	<!-- Porter-Duff with half white over half black: over has 2/3 white and 
		3/4 alpha; atop/xor have 1/2 white and 1/2 alpha. -->
	<rect x="0" y="0" width="16" height="16" fill="#aaaaaa"
		fill-opacity="0.7529411764705882" />
	<rect x="20" y="0" width="16" height="16" fill="#aaaaaa"
		fill-opacity="0.7529411764705882" />
	<rect x="40" y="0" width="16" height="16" fill="#aaaaaa"
		fill-opacity="0.7529411764705882" />
	<rect x="60" y="0" width="16" height="16" fill="#aaaaaa"
		fill-opacity="0.7529411764705882" />
	<rect x="0" y="20" width="16" height="16" fill="#808080"
		fill-opacity="0.5019607843137255" />
	<rect x="20" y="20" width="16" height="16" fill="#808080"
		fill-opacity="0.5019607843137255" />
	<rect x="40" y="20" width="16" height="16" fill="#808080"
		fill-opacity="0.5019607843137255" />
	<rect x="60" y="20" width="16" height="16" fill="#808080"
		fill-opacity="0.5019607843137255" />
	<rect x="0" y="40" width="16" height="16" fill="#808080"
		fill-opacity="0.5019607843137255" />
	<rect x="20" y="40" width="16" height="16" fill="#808080"
		fill-opacity="0.5019607843137255" />
	<rect x="40" y="40" width="16" height="16" fill="#808080"
		fill-opacity="0.5019607843137255" />
	<rect x="60" y="40" width="16" height="16" fill="#808080"
		fill-opacity="0.5019607843137255" />
</svg>
