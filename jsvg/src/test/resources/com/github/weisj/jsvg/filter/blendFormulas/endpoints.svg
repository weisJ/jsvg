<svg xmlns="http://www.w3.org/2000/svg" width="80" height="20">
	<defs>
		<filter id="dodgeBlack" x="0" y="0" width="1" height="1"
			color-interpolation-filters="sRGB">
			<feFlood flood-color="white"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="SourceGraphic" mode="color-dodge" />
		</filter>
		<filter id="burnWhite" x="0" y="0" width="1" height="1"
			color-interpolation-filters="sRGB">
			<feFlood flood-color="black"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="SourceGraphic" mode="color-burn" />
		</filter>
	</defs>
	<!-- Dodge: black backdrop takes priority over white source; otherwise white 
		source saturates the overlap. -->
	<rect width="16" height="16" fill="black"
		fill-opacity="0.6666666666666666" filter="url(#dodgeBlack)" />
	<rect x="20" width="16" height="16" fill="#333"
		fill-opacity="0.6666666666666666" filter="url(#dodgeBlack)" />
	<!-- Burn: white backdrop takes priority over black source; otherwise black 
		source blackens the overlap. -->
	<rect x="40" width="16" height="16" fill="white"
		fill-opacity="0.6666666666666666" filter="url(#burnWhite)" />
	<rect x="60" width="16" height="16" fill="#ccc"
		fill-opacity="0.6666666666666666" filter="url(#burnWhite)" />
</svg>
