<svg xmlns="http://www.w3.org/2000/svg" width="40" height="80">
	<!-- W3C blend equation: co=(1-Ab)*As*Cs+(1-As)*Ab*Cb+As*Ab*B(Cb,Cs); Ao=As+Ab-As*Ab. 
		Round output to 8-bit premultiplied RGBA, then express as ordinary SVG artwork. -->
	<!-- hue: B=0.01500000, 0.61500000, 0.31500000 -->
	<rect x="0" y="0" width="16" height="16" fill="#7d6161"
		fill-opacity="0.7764705882352941" />
	<!-- hue: B=0.01500000, 0.61500000, 0.31500000 -->
	<rect x="20" y="0" width="16" height="16" fill="#7d6161"
		fill-opacity="0.7764705882352941" />
	<!-- saturation: B=0.66733333, 0.26733333, 0.40066667 -->
	<rect x="0" y="20" width="16" height="16" fill="#ad4766"
		fill-opacity="0.7764705882352941" />
	<!-- saturation: B=0.66733333, 0.26733333, 0.40066667 -->
	<rect x="20" y="20" width="16" height="16" fill="#ad4766"
		fill-opacity="0.7764705882352941" />
	<!-- color: B=0.14400000, 0.54400000, 0.34400000 -->
	<rect x="0" y="40" width="16" height="16" fill="#865a62"
		fill-opacity="0.7764705882352941" />
	<!-- color: B=0.14400000, 0.54400000, 0.34400000 -->
	<rect x="20" y="40" width="16" height="16" fill="#865a62"
		fill-opacity="0.7764705882352941" />
	<!-- luminosity: B=0.85600000, 0.25600000, 0.45600000 -->
	<rect x="0" y="60" width="16" height="16" fill="#bb466b"
		fill-opacity="0.7764705882352941" />
	<!-- luminosity: B=0.85600000, 0.25600000, 0.45600000 -->
	<rect x="20" y="60" width="16" height="16" fill="#bb466b"
		fill-opacity="0.7764705882352941" />
</svg>
