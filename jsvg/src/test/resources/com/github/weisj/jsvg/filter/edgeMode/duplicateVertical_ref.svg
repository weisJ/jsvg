<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500"
	viewBox="0 0 144 80">
	<defs>
		<filter id="f" filterUnits="userSpaceOnUse" x="-100" y="-100"
			width="344" height="280" color-interpolation-filters="sRGB">
			<feGaussianBlur stdDeviation="0 1.5" edgeMode="none" />
		</filter>
	</defs>
	<rect width="144" height="80" fill="#d8d8d8" />
	<!-- Supply the vertical duplicate-edge samples explicitly. -->
	<g filter="url(#f)">
		<rect x="32" y="-100" width="12" height="132" fill="#e08040" />
		<rect x="44" y="-100" width="12" height="132" fill="#40c080" />
		<rect x="32" y="32" width="12" height="148" fill="#204060" />
		<rect x="44" y="32" width="12" height="148" fill="#8040c0" />
	</g>
</svg>
