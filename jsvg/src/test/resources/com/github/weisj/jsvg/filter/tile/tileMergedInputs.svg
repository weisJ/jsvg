<svg xmlns="http://www.w3.org/2000/svg" width="100" height="20">
	<defs>
		<filter id="tile" filterUnits="userSpaceOnUse" x="0" y="0"
			width="100" height="20">
			<feTile in="SourceGraphic" x="0" y="0" width="10" height="20"
				result="left" />
			<feTile in="SourceGraphic" x="10" y="0" width="10" height="20"
				result="right" />
			<feMerge>
				<feMergeNode in="left" />
				<feMergeNode in="right" />
			</feMerge>
			<feTile />
		</filter>
	</defs>
	<g filter="url(#tile)">
		<rect width="10" height="20" fill="red" />
		<rect x="10" width="10" height="20" fill="blue" />
	</g>
</svg>
