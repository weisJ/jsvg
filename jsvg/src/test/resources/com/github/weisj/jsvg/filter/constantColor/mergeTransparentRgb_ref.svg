<svg xmlns="http://www.w3.org/2000/svg" width="220" height="110"
	viewBox="0 0 220 110">
	<!-- Source-over compositing operates on premultiplied colors. Fully transparent 
		inputs therefore merge to transparent black, regardless of input order. Restoring 
		alpha reveals black. -->
	<g transform="translate(0 0)">
		<rect height="100" x="0" y="0" fill="#000000" width="100" />
	</g>
	<!-- mergeTransparentRgbLast -->
	<g transform="translate(110 0)">
		<rect height="100" x="0" y="0" fill="#000000" width="100" />
	</g>
</svg>
