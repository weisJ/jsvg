<svg xmlns="http://www.w3.org/2000/svg" width="220" height="110"
	viewBox="0 0 220 110">
	<!-- opaque -->
	<g transform="translate(0 0)">
		<rect width="100" height="100" fill="#ff0000" fill-opacity="1.0" />
	</g>
	<!-- translucent -->
	<g transform="translate(110 0)">
		<rect width="100" height="100" fill="#336699"
			fill-opacity="0.5019607843137255" />
	</g>
</svg>
