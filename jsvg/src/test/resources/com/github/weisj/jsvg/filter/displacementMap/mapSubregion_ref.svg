<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
	<!-- The map is opaque only in its subregion; transparent surroundings reverse 
		displacement. -->
	<g fill="red">
		<rect x="25" y="25" width="15" height="15" />
		<rect x="40" y="35" width="15" height="20" />
		<rect x="35" y="40" width="5" height="15" />
	</g>
</svg>
