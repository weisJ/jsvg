<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80">
  <defs>
    <!-- Crop to the center half of the image/group positioning bounds. -->
    <filter id="crop" x="25%" y="25%" width="50%" height="50%"><feColorMatrix/></filter>
  </defs>
  <!-- The positioning box is square even though the fitted artwork is not. -->
  <g filter="url(#crop)">
    <image href="red.png" x="24" y="16" width="32" height="32"/>
  </g>
</svg>
