<svg xmlns="http://www.w3.org/2000/svg"
	xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100"
	viewBox="0 0 100 100">
	<defs>
		<filter id="f" filterUnits="userSpaceOnUse" width="100"
			height="100" x="0" y="0" color-interpolation-filters="sRGB">
			<feOffset dx="15" />
			<feMerge>
				<feMergeNode />
			</feMerge>
		</filter>
	</defs>
	<g filter="url(#f)">
		<rect height="20" x="20" y="30" fill="#ff0000" width="15" />
		<rect height="20" x="45" y="30" fill="#0000ff" width="15" />
	</g>
</svg>
