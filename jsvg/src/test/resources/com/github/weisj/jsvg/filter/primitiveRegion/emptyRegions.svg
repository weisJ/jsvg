<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220"
	viewBox="0 0 440 220">
	<!-- emptyFlood -->
	<g transform="translate(0 0)">
		<defs>
			<filter id="f0" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feFlood width="0" />
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f0)" />
	</g>
	<!-- offscreenFlood -->
	<g transform="translate(110 0)">
		<defs>
			<filter id="f1" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feFlood x="200" width="20" />
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f1)" />
	</g>
	<!-- emptyTurbulence -->
	<g transform="translate(220 0)">
		<defs>
			<filter id="f2" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feTurbulence width="0" />
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f2)" />
	</g>
	<!-- emptyMatrix -->
	<g transform="translate(330 0)">
		<defs>
			<filter id="f3" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feColorMatrix width="0" />
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f3)" />
	</g>
	<!-- negativeMatrix -->
	<g transform="translate(0 110)">
		<defs>
			<filter id="f4" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feColorMatrix width="-10" />
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f4)" />
	</g>
</svg>
