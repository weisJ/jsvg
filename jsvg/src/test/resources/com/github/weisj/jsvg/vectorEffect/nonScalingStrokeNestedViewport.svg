<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180">
	<!-- The inner viewBox scales by (3, 2). Stroke width still uses the outer 
		viewport. -->
	<svg x="12" y="10" width="96" height="64" viewBox="0 0 32 32"
		preserveAspectRatio="none">
		<rect x="4" y="4" width="24" height="20" fill="none"
			stroke="black" stroke-width="6" vector-effect="non-scaling-stroke" />
	</svg>
</svg>
