<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"
	viewBox="0 0 600 600">
	<defs>
		<filter id="finiteInput" filterUnits="userSpaceOnUse" x="0"
			y="0" width="300" height="300" color-interpolation-filters="sRGB">
			<feGaussianBlur x="0" y="0" width="300" height="300"
				stdDeviation="30" />
		</filter>
	</defs>

	<rect x="100" y="100" width="100" height="100" fill="#2e8b57"
		filter="url(#finiteInput)" />
	<rect x="400" y="100" width="100" height="100" fill="#a05020" />
	<rect x="0" y="300" width="300" height="300" fill="#336699"
		fill-opacity="0.5" />
	<rect x="325" y="325" width="250" height="250" fill="#8050b0"
		fill-opacity="0.75" />
</svg>
