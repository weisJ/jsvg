<svg xmlns="http://www.w3.org/2000/svg" width="440" height="110" viewBox="0 0 440 110">
    <!-- reuseMatrix -->
    <g transform="translate(0 0)">
        <rect width="10" fill="#000000" y="10" x="10" height="10" />
        <rect width="20" fill="#ff0000" y="50" x="50" height="20" />
    </g>
    <!-- reuseTransfer -->
    <g transform="translate(110 0)">
        <rect width="10" fill="#000000" y="10" x="10" height="10" />
        <rect width="20" fill="#000000" y="50" x="50" height="20" />
    </g>
    <!-- reuseComposite -->
    <g transform="translate(220 0)">
        <rect width="10" fill="#000000" y="10" x="10" height="10" />
        <rect width="20" fill="#ffffff" y="50" x="50" height="20" />
    </g>
    <!-- reuseLighting -->
    <g transform="translate(330 0)">
        <rect width="10" fill="#000000" y="10" x="10" height="10" />
        <rect width="20" fill="#ffffff" y="50" x="50" height="20" />
    </g>
</svg>
