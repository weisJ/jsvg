<svg xmlns="http://www.w3.org/2000/svg" width="40" height="100">
	<!-- Source #33cc99 at 1/3 opacity over backdrop #cc3366 at 2/3. Both colors 
		have exact byte premultiplication. -->
	<defs>
		<filter id="overlayconstants" x="0" y="0" width="1" height="1"
			color-interpolation-filters="sRGB">
			<feFlood flood-color="#cc3366"
				flood-opacity="0.6666666666666666" result="backdrop" />
			<feFlood flood-color="#33cc99"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="backdrop" mode="overlay" />
		</filter>
		<filter id="overlayartwork" x="0" y="0" width="1" height="1"
			color-interpolation-filters="sRGB">

			<feFlood flood-color="#33cc99"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="SourceGraphic" mode="overlay" />
		</filter>
		<filter id="hard-lightconstants" x="0" y="0" width="1"
			height="1" color-interpolation-filters="sRGB">
			<feFlood flood-color="#cc3366"
				flood-opacity="0.6666666666666666" result="backdrop" />
			<feFlood flood-color="#33cc99"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="backdrop" mode="hard-light" />
		</filter>
		<filter id="hard-lightartwork" x="0" y="0" width="1" height="1"
			color-interpolation-filters="sRGB">

			<feFlood flood-color="#33cc99"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="SourceGraphic" mode="hard-light" />
		</filter>
		<filter id="color-dodgeconstants" x="0" y="0" width="1"
			height="1" color-interpolation-filters="sRGB">
			<feFlood flood-color="#cc3366"
				flood-opacity="0.6666666666666666" result="backdrop" />
			<feFlood flood-color="#33cc99"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="backdrop" mode="color-dodge" />
		</filter>
		<filter id="color-dodgeartwork" x="0" y="0" width="1"
			height="1" color-interpolation-filters="sRGB">

			<feFlood flood-color="#33cc99"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="SourceGraphic" mode="color-dodge" />
		</filter>
		<filter id="color-burnconstants" x="0" y="0" width="1"
			height="1" color-interpolation-filters="sRGB">
			<feFlood flood-color="#cc3366"
				flood-opacity="0.6666666666666666" result="backdrop" />
			<feFlood flood-color="#33cc99"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="backdrop" mode="color-burn" />
		</filter>
		<filter id="color-burnartwork" x="0" y="0" width="1" height="1"
			color-interpolation-filters="sRGB">

			<feFlood flood-color="#33cc99"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="SourceGraphic" mode="color-burn" />
		</filter>
		<filter id="exclusionconstants" x="0" y="0" width="1"
			height="1" color-interpolation-filters="sRGB">
			<feFlood flood-color="#cc3366"
				flood-opacity="0.6666666666666666" result="backdrop" />
			<feFlood flood-color="#33cc99"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="backdrop" mode="exclusion" />
		</filter>
		<filter id="exclusionartwork" x="0" y="0" width="1" height="1"
			color-interpolation-filters="sRGB">

			<feFlood flood-color="#33cc99"
				flood-opacity="0.3333333333333333" result="source" />
			<feBlend in="source" in2="SourceGraphic" mode="exclusion" />
		</filter>
	</defs>
	<!-- overlay, constants -->
	<rect x="0" y="0" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#overlayconstants)" />
	<!-- overlay, artwork -->
	<rect x="20" y="0" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#overlayartwork)" />
	<!-- hard-light, constants -->
	<rect x="0" y="20" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#hard-lightconstants)" />
	<!-- hard-light, artwork -->
	<rect x="20" y="20" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#hard-lightartwork)" />
	<!-- color-dodge, constants -->
	<rect x="0" y="40" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#color-dodgeconstants)" />
	<!-- color-dodge, artwork -->
	<rect x="20" y="40" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#color-dodgeartwork)" />
	<!-- color-burn, constants -->
	<rect x="0" y="60" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#color-burnconstants)" />
	<!-- color-burn, artwork -->
	<rect x="20" y="60" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#color-burnartwork)" />
	<!-- exclusion, constants -->
	<rect x="0" y="80" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#exclusionconstants)" />
	<!-- exclusion, artwork -->
	<rect x="20" y="80" width="16" height="16" fill="#cc3366"
		fill-opacity="0.6666666666666666" filter="url(#exclusionartwork)" />
</svg>
