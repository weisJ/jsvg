<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100">
  <!-- Blur samples beyond the tile subregion must remain available during a clipped render. -->
  <defs>
    <filter id="tile" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <feGaussianBlur stdDeviation="1.5" x="10" y="10" width="10" height="10"/>
      <feTile/>
    </filter>
  </defs>
  <rect x="18" y="10" width="4" height="10" fill="red" filter="url(#tile)"/>
</svg>
