<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440"
	viewBox="0 0 440 440">
	<!-- flood -->
	<g transform="translate(0 0)">
		<defs>
			<filter id="f0" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feFlood x="20" y="20" width="20" height="20"
					result="clipped" />
				<feFlood flood-opacity="0" />
				<feMerge>
					<feMergeNode in="clipped" />
					<feMergeNode />
				</feMerge>
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f0)" />
	</g>
	<!-- offset -->
	<g transform="translate(110 0)">
		<defs>
			<filter id="f1" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feOffset x="20" y="20" width="20" height="20"
					result="clipped" />
				<feFlood flood-opacity="0" />
				<feMerge>
					<feMergeNode in="clipped" />
					<feMergeNode />
				</feMerge>
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f1)" />
	</g>
	<!-- identityBlur -->
	<g transform="translate(220 0)">
		<defs>
			<filter id="f2" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feGaussianBlur x="20" y="20" width="20" height="20"
					result="clipped" stdDeviation="0" />
				<feFlood flood-opacity="0" />
				<feMerge>
					<feMergeNode in="clipped" />
					<feMergeNode />
				</feMerge>
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f2)" />
	</g>
	<!-- blur -->
	<g transform="translate(330 0)">
		<defs>
			<filter id="f3" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feGaussianBlur x="20" y="20" width="20" height="20"
					result="clipped" stdDeviation="2" />
				<feFlood flood-opacity="0" />
				<feMerge>
					<feMergeNode in="clipped" />
					<feMergeNode />
				</feMerge>
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f3)" />
	</g>
	<!-- identityMatrix -->
	<g transform="translate(0 110)">
		<defs>
			<filter id="f4" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feColorMatrix x="20" y="20" width="20" height="20"
					result="clipped" />
				<feFlood flood-opacity="0" />
				<feMerge>
					<feMergeNode in="clipped" />
					<feMergeNode />
				</feMerge>
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f4)" />
	</g>
	<!-- saturate -->
	<g transform="translate(110 110)">
		<defs>
			<filter id="f5" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feColorMatrix x="20" y="20" width="20" height="20"
					result="clipped" type="saturate" values="0" />
				<feFlood flood-opacity="0" />
				<feMerge>
					<feMergeNode in="clipped" />
					<feMergeNode />
				</feMerge>
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f5)" />
	</g>
	<!-- identityTransfer -->
	<g transform="translate(220 110)">
		<defs>
			<filter id="f6" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feComponentTransfer x="20" y="20" width="20"
					height="20" result="clipped" />
				<feFlood flood-opacity="0" />
				<feMerge>
					<feMergeNode in="clipped" />
					<feMergeNode />
				</feMerge>
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f6)" />
	</g>
	<!-- alphaTransfer -->
	<g transform="translate(330 110)">
		<defs>
			<filter id="f7" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feComponentTransfer x="20" y="20" width="20"
					height="20" result="clipped">
					<feFuncA type="linear" slope="0.5" />
				</feComponentTransfer>
				<feFlood flood-opacity="0" />
				<feMerge>
					<feMergeNode in="clipped" />
					<feMergeNode />
				</feMerge>
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f7)" />
	</g>
	<!-- composite -->
	<g transform="translate(0 220)">
		<defs>
			<filter id="f8" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feComposite x="20" y="20" width="20" height="20"
					result="clipped" in2="SourceAlpha" />
				<feFlood flood-opacity="0" />
				<feMerge>
					<feMergeNode in="clipped" />
					<feMergeNode />
				</feMerge>
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f8)" />
	</g>
	<!-- blend -->
	<g transform="translate(110 220)">
		<defs>
			<filter id="f9" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feBlend x="20" y="20" width="20" height="20"
					result="clipped" in2="SourceAlpha" />
				<feFlood flood-opacity="0" />
				<feMerge>
					<feMergeNode in="clipped" />
					<feMergeNode />
				</feMerge>
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f9)" />
	</g>
	<!-- merge -->
	<g transform="translate(220 220)">
		<defs>
			<filter id="f10" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feMerge x="20" y="20" width="20" height="20"
					result="clipped">
					<feMergeNode in="SourceGraphic" />
				</feMerge>
				<feFlood flood-opacity="0" />
				<feMerge>
					<feMergeNode in="clipped" />
					<feMergeNode />
				</feMerge>
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f10)" />
	</g>
	<!-- identityDisplacement -->
	<g transform="translate(330 220)">
		<defs>
			<filter id="f11" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feDisplacementMap x="20" y="20" width="20"
					height="20" result="clipped" in2="SourceAlpha" scale="0" />
				<feFlood flood-opacity="0" />
				<feMerge>
					<feMergeNode in="clipped" />
					<feMergeNode />
				</feMerge>
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f11)" />
	</g>
	<!-- displacement -->
	<g transform="translate(0 330)">
		<defs>
			<filter id="f12" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feDisplacementMap x="20" y="20" width="20"
					height="20" result="clipped" in2="SourceAlpha" scale="6" />
				<feFlood flood-opacity="0" />
				<feMerge>
					<feMergeNode in="clipped" />
					<feMergeNode />
				</feMerge>
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f12)" />
	</g>
	<!-- lighting -->
	<g transform="translate(110 330)">
		<defs>
			<filter id="f13" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feDiffuseLighting x="20" y="20" width="20"
					height="20" result="clipped">
					<feDistantLight elevation="90" />
				</feDiffuseLighting>
				<feFlood flood-opacity="0" />
				<feMerge>
					<feMergeNode in="clipped" />
					<feMergeNode />
				</feMerge>
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f13)" />
	</g>
	<!-- turbulence -->
	<g transform="translate(220 330)">
		<defs>
			<filter id="f14" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feTurbulence x="20" y="20" width="20" height="20"
					result="clipped" type="fractalNoise" baseFrequency="0.05" />
				<feFlood flood-opacity="0" />
				<feMerge>
					<feMergeNode in="clipped" />
					<feMergeNode />
				</feMerge>
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f14)" />
	</g>
	<!-- dropShadow -->
	<g transform="translate(330 330)">
		<defs>
			<filter id="f15" filterUnits="userSpaceOnUse" x="0" y="0"
				width="100" height="100">
				<feDropShadow x="20" y="20" width="20" height="20"
					result="clipped" stdDeviation="0" dx="0" dy="0" />
				<feFlood flood-opacity="0" />
				<feMerge>
					<feMergeNode in="clipped" />
					<feMergeNode />
				</feMerge>
			</filter>
		</defs>
		<rect x="5" y="5" width="75" height="75" fill="red"
			filter="url(#f15)" />
	</g>
</svg>
